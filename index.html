<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mohazecom Ltd</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f4f6f8;
      color: #333;
    }

    header {
      background: linear-gradient(to right, #1d3557, #457b9d);
      color: white;
      padding: 1.5rem 2rem;
      text-align: center;
    }

    nav {
      margin-top: 1rem;
    }

    nav a {
      color: white;
      margin: 0 1rem;
      text-decoration: none;
      font-weight: 500;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .hero {
      background-color: #bbb;
      padding: 4rem 2rem;
      text-align: center;
      color: white;
    }

    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .categories {
      padding: 2rem;
      text-align: center;
    }

    .categories h2 {
      font-size: 1.8rem;
      margin-bottom: 2rem;
      color: #1d3557;
    }

    .category-cards {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem;
    }

    .card {
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      width: 250px;
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card a {
      display: block;
      padding: 1rem;
      text-decoration: none;
      color: #1d3557;
      font-weight: bold;
    }

    footer {
      background-color: #1d3557;
      color: white;
      text-align: center;
      padding: 2rem 1rem;
      margin-top: 3rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Mohazecom Ltd</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="phones.html">Phones</a>
      <a href="#">TVs</a>
      <a href="#">Accessories</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Best Deals on Electronics in Kenya</h1>
    <p>Shop smartphones, TVs, accessories and more – fast delivery, great prices.</p>
  </section>

  <section class="categories">
    <h2>Our Categories</h2>
    <div class="category-cards">
      <div class="card">
        <img src="https://images.unsplash.com/photo-1660664602847-0a5191b21f9e?auto=format&fit=crop&w=800&q=80" alt="Phones" />
        <a href="phones.html">View Phones</a>
      </div>
      <div class="card">
        <img src="https://images.unsplash.com/photo-1606813902773-cfdcd3f4369e?auto=format&fit=crop&w=800&q=80" alt="TVs" />
        <a href="#">View Televisions</a>
      </div>
      <div class="card">
        <img src="https://images.unsplash.com/photo-1580910051073-df066faae6da?auto=format&fit=crop&w=800&q=80" alt="Accessories" />
        <a href="#">View Accessories</a>
      </div>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 Mohazecom Ltd. All rights reserved.</p>
  </footer>
</body>
</html>
